# yaml-language-server: $schema=https://raw.githubusercontent.com/flipt-io/flipt/v2/config/flipt.schema.json

version: "2.0"
log:
  level: INFO
  encoding: console
  grpc_level: ERROR
meta:
  check_for_updates: true
  telemetry_enabled: false
server:
  host: 0.0.0.0
  protocol: http
  http_port: 8080
  https_port: 443
  grpc_port: 9000
environments:
  default:
    name: default
    default: true
    storage: default
storage:
  default:
    backend:
      type: local
      path: ${PWD}/flipt
    branch: main
    poll_interval: 30s
metrics:
  enabled: false
  exporter: prometheus
ui:
  enabled: false
  default_theme: system
